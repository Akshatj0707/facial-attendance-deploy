name: ⚙️ Enable GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      contents: read

    steps:
      - name: Enable GitHub Pages via API
        run: |
          echo "Enabling GitHub Pages for gh-pages branch..."

          # Try to create Pages config
          RESP=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Akshatj0707/facial-attendance-deploy/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "Create response: $RESP"

          # Try to update if already exists
          RESP2=$(curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Akshatj0707/facial-attendance-deploy/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "Update response: $RESP2"

          # Get current pages status
          STATUS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Akshatj0707/facial-attendance-deploy/pages")
          echo "Pages status: $STATUS"

          URL=$(echo "$STATUS" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print(d.get('html_url',''))
          " 2>/dev/null || echo "")
          echo "🌐 Pages URL: $URL"

      - name: Summary
        if: always()
        run: |
          URL="https://akshatj0707.github.io/facial-attendance-deploy/"
          {
            echo "## 🎓 Facial Attendance System"
            echo ""
            echo "**GitHub Pages URL:** [$URL]($URL)"
            echo ""
            echo "| Page | Link |"
            echo "|------|------|"
            echo "| Dashboard | [$URL]($URL) |"
            echo "| Attendance | [${URL}attendance.html](${URL}attendance.html) |"
            echo "| Students | [${URL}students.html](${URL}students.html) |"
            echo "| Recognition | [${URL}recognition.html](${URL}recognition.html) |"
          } >> $GITHUB_STEP_SUMMARY
