name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
      - name: Done
        run: |
          echo "✅ Live: https://akshatj0707.github.io/facial-attendance-deploy/"
          echo "## 🌐 Live!" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://akshatj0707.github.io/facial-attendance-deploy/" >> $GITHUB_STEP_SUMMARY
