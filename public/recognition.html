<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="page-title" content="Face Recognition"/><meta name="page-sub" content="Live camera attendance marking"/>
<title>Recognition — Attendance System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<script src="db.js"></script><script src="layout.js"></script>
</head>
<body>
<script>
const user  = App.init(['admin','hod','faculty']);
const deptF = user?.role==='admin' ? null : user?.dept;
let stream=null, detectLoop=null, modelsLoaded=false, capturing=false, frameCount=0, lastFps=Date.now();
const $=id=>document.getElementById(id);

function render() {
  document.getElementById('page-content').innerHTML = `
  <div style="max-width:1200px">
    <div style="display:grid;grid-template-columns:3fr 2fr;gap:20px;align-items:start" class="rec-grid">

      <!-- Camera -->
      <div>
        <div class="card" style="overflow:hidden">
          <div style="padding:14px 18px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px">
            <div style="width:10px;height:10px;border-radius:50%;background:#10b981;animation:pulse2 1.5s infinite" id="live-dot"></div>
            <span style="font-size:13px;font-weight:700;color:#0f172a" id="cam-status-txt">Camera Ready</span>
            <div style="margin-left:auto;display:flex;gap:12px">
              <span id="cam-fps" style="font-size:11px;color:#94a3b8;font-family:monospace">FPS: —</span>
              <span id="cam-res" style="font-size:11px;color:#94a3b8;font-family:monospace">—</span>
            </div>
          </div>
          <div style="position:relative;background:#0f172a;aspect-ratio:16/9;overflow:hidden">
            <div id="cam-placeholder" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
              <div style="width:100px;height:100px;border-radius:50%;border:3px dashed #334155;display:flex;align-items:center;justify-content:center;animation:breathe 2s ease-in-out infinite">
                <span class="material-symbols-outlined" style="font-size:48px;color:#475569">face_unlock</span>
              </div>
              <p style="color:#475569;font-size:13px;margin:0">Click Start to begin recognition</p>
              <button onclick="startCamera()" style="background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:white;border:none;padding:10px 24px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px">
                <span class="material-symbols-outlined" style="font-size:18px">videocam</span>Start Camera
              </button>
            </div>
            <video id="cam-video" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover;display:none;transform:scaleX(-1)"></video>
            <canvas id="cam-canvas" style="position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);display:none;pointer-events:none"></canvas>
            <div id="scan-line" style="display:none;position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#3b82f6,transparent);animation:scan 2s linear infinite"></div>
            <div id="capture-flash" style="position:absolute;inset:0;background:white;opacity:0;pointer-events:none;transition:opacity .1s"></div>
            <!-- Detection pill -->
            <div id="detect-pill" style="position:absolute;top:12px;left:12px;background:rgba(0,0,0,.75);border-radius:20px;padding:5px 12px;display:none;backdrop-filter:blur(4px)">
              <div style="display:flex;align-items:center;gap:6px">
                <div id="detect-dot" style="width:7px;height:7px;border-radius:50%;background:#10b981;animation:pulse2 1s infinite"></div>
                <span id="detect-txt" style="color:white;font-size:11px;font-weight:600">SCANNING</span>
              </div>
            </div>
          </div>
          <!-- Controls -->
          <div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;background:#fafbff">
            <button id="btn-start" onclick="startCamera()" class="btn btn-primary" style="font-size:12px">
              <span class="material-symbols-outlined" style="font-size:16px">videocam</span>Start
            </button>
            <button id="btn-capture" onclick="captureAndRecognize()" disabled class="btn" style="background:linear-gradient(135deg,#10b981,#059669);color:white;font-size:12px">
              <span class="material-symbols-outlined" style="font-size:16px">face_unlock</span>Recognize &amp; Mark
            </button>
            <button id="btn-stop" onclick="stopCamera()" disabled class="btn btn-secondary" style="font-size:12px">
              <span class="material-symbols-outlined" style="font-size:16px">videocam_off</span>Stop
            </button>
            <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
              <span style="font-size:12px;color:#64748b">Space to capture</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Right panel -->
      <div style="display:flex;flex-direction:column;gap:16px">
        <!-- Result card -->
        <div class="card" style="padding:20px">
          <h3 style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 14px;display:flex;align-items:center;gap:6px">
            <span class="material-symbols-outlined" style="font-size:18px;color:#3b82f6">verified_user</span>Recognition Result
          </h3>
          <div id="result-card" style="text-align:center;padding:20px 0">
            <div style="width:70px;height:70px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
              <span class="material-symbols-outlined" style="font-size:36px;color:#cbd5e1">person_search</span>
            </div>
            <p style="font-size:13px;color:#94a3b8;margin:0">Waiting for recognition…</p>
          </div>
        </div>

        <!-- Terminals -->
        <div class="card" style="padding:20px">
          <h3 style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 12px;display:flex;align-items:center;gap:6px">
            <span class="material-symbols-outlined" style="font-size:18px;color:#8b5cf6">sensors</span>Active Terminals
          </h3>
          <div id="terminal-list" style="display:flex;flex-direction:column;gap:6px"></div>
        </div>

        <!-- Live feed -->
        <div class="card" style="padding:20px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <h3 style="font-size:13px;font-weight:700;color:#0f172a;margin:0;display:flex;align-items:center;gap:6px">
              <span class="material-symbols-outlined" style="font-size:18px;color:#10b981">monitoring</span>Live Feed
            </h3>
            <span style="font-size:10px;color:#94a3b8;font-weight:600;animation:pulse2 2s infinite">● LIVE</span>
          </div>
          <div id="live-feed" style="display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto"></div>
        </div>
      </div>
    </div>
  </div>
  <style>
    @keyframes scan{0%{top:0}100%{top:100%}}
    @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}
    @media(max-width:768px){.rec-grid{grid-template-columns:1fr!important}}
  </style>`;
  loadTerminals(); loadFeed(); loadModels();
}

async function loadModels() {
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
    modelsLoaded=true;
  } catch(e) { modelsLoaded=false; }
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
    const vid=$('cam-video'); vid.srcObject=stream;
    await new Promise(r=>vid.addEventListener('loadedmetadata',r,{once:true})); vid.play();
    vid.style.display='block'; $('cam-canvas').style.display='block';
    $('cam-placeholder').style.display='none'; $('detect-pill').style.display='block';
    $('scan-line').style.display='block';
    $('btn-start').disabled=true; $('btn-capture').disabled=false; $('btn-stop').disabled=false;
    $('cam-status-txt').textContent='Camera Active'; $('live-dot').style.background='#10b981';
    const cv=$('cam-canvas');
    const sync=()=>{cv.width=vid.videoWidth||1280;cv.height=vid.videoHeight||720;$('cam-res').textContent=`${cv.width}×${cv.height}`;};
    sync(); vid.addEventListener('resize',sync);
    startDetectLoop();
  } catch(e) { App.toast('Camera error: '+e.message,'error'); }
}

function startDetectLoop() {
  const vid=$('cam-video'), cv=$('cam-canvas'); if(!vid||!cv) return;
  const ctx=cv.getContext('2d');
  let hold=0, prog=0;
  async function loop() {
    if (!stream) return;
    frameCount++; const now=Date.now();
    if (now-lastFps>=1000) { $('cam-fps').textContent=`FPS: ${frameCount}`; frameCount=0; lastFps=now; }
    ctx.clearRect(0,0,cv.width,cv.height);
    if (modelsLoaded&&vid.readyState>=2) {
      try {
        const dets=await faceapi.detectAllFaces(vid,new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:0.45}));
        if (dets.length>0) {
          hold=15; prog=Math.min(100,prog+10);
          const dt=$('detect-txt'); if(dt) dt.textContent=`${dets.length} FACE${dets.length>1?'S':''} DETECTED`;
          const sx=cv.width/(vid.videoWidth||1), sy=cv.height/(vid.videoHeight||1);
          dets.forEach(d=>{
            const {x,y,width:w,height:h}=d.box;
            const bx=x*sx,by=y*sy,bw=w*sx,bh=h*sy,cs=20;
            ctx.strokeStyle='#10b981'; ctx.lineWidth=2.5; ctx.shadowBlur=14; ctx.shadowColor='#10b981';
            ctx.beginPath();
            [[bx,by,cs,0,0,cs],[bx+bw,by,-cs,0,0,cs],[bx,by+bh,cs,0,0,-cs],[bx+bw,by+bh,-cs,0,0,-cs]]
              .forEach(([ox,oy,d1,d2,d3,d4])=>{ctx.moveTo(ox+d1,oy+d2);ctx.lineTo(ox,oy);ctx.lineTo(ox+d3,oy+d4)});
            ctx.stroke(); ctx.shadowBlur=0;
            ctx.fillStyle='rgba(16,185,129,.15)'; ctx.fillRect(bx,by,bw,bh);
            ctx.fillStyle='#10b981'; ctx.font='bold 11px Inter';
            ctx.fillText(`${Math.round(d.score*100)}% FACE`,bx+5,by-6);
          });
        } else if(hold>0){hold--;}
        else { const dt=$('detect-txt'); if(dt) dt.textContent='SCANNING'; prog=Math.max(0,prog-8); }
      } catch(e){}
    } else { prog=60+Math.sin(Date.now()/500)*20; }
    detectLoop=requestAnimationFrame(loop);
  }
  loop();
}

async function captureAndRecognize() {
  if (capturing||!stream) return; capturing=true;
  $('btn-capture').textContent='Recognizing…'; $('btn-capture').disabled=true;
  const fl=$('capture-flash'); fl.style.opacity='.85'; setTimeout(()=>fl.style.opacity='0',120);

  await new Promise(r=>setTimeout(r,400));

  const result = DB.recognize(deptF);
  if (!result) { App.toast('No enrolled students in '+(deptF||'any dept'),'warning'); capturing=false; $('btn-capture').innerHTML='<span class="material-symbols-outlined" style="font-size:16px">face_unlock</span>Recognize & Mark'; $('btn-capture').disabled=false; return; }

  // Show result
  const { student:s, conf, status } = result;
  const isLate = status==='Late';
  const rc = document.getElementById('result-card');
  rc.innerHTML = `
    <div style="width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:white;margin:0 auto 12px">${s.avatar}</div>
    <h3 style="font-size:15px;font-weight:800;color:#0f172a;margin:0">${s.name}</h3>
    <p style="font-size:12px;color:#64748b;margin:3px 0 6px">${s.stuId} · ${s.dept}</p>
    <div style="margin-bottom:10px">${App.badgeHtml(status)}</div>
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap">
      <span style="font-size:11px;background:#f1f5f9;padding:4px 10px;border-radius:8px;color:#374151">Conf: ${Math.round(conf*100)}%</span>
      <span style="font-size:11px;background:#f1f5f9;padding:4px 10px;border-radius:8px;color:#374151">${new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</span>
    </div>
    <div style="width:100%;height:6px;background:#f1f5f9;border-radius:99px;overflow:hidden">
      <div style="height:100%;background:${isLate?'#f59e0b':'#10b981'};border-radius:99px;width:${Math.round(conf*100)}%;transition:width .8s ease"></div>
    </div>
    <p style="font-size:12px;font-weight:700;color:${isLate?'#92400e':'#166534'};margin-top:8px">✅ Attendance Recorded</p>`;

  App.toast(`${s.name} — ${status}`, isLate?'warning':'success');
  loadFeed();

  capturing=false;
  $('btn-capture').innerHTML='<span class="material-symbols-outlined" style="font-size:16px">face_unlock</span>Recognize & Mark';
  $('btn-capture').disabled=false;
}

function stopCamera() {
  if (detectLoop) cancelAnimationFrame(detectLoop);
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
  ['cam-video','cam-canvas','detect-pill','scan-line'].forEach(id=>{ const e=$(id); if(e) e.style.display='none'; });
  $('cam-placeholder').style.display='flex';
  $('btn-start').disabled=false; $('btn-capture').disabled=true; $('btn-stop').disabled=true;
  $('cam-status-txt').textContent='Camera Stopped'; $('live-dot').style.background='#94a3b8';
}

function loadTerminals() {
  const el=$('terminal-list'); if(!el) return;
  const terms=DB.getTerminals();
  el.innerHTML=terms.map(t=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:${t.status==='Online'?'#f0fdf4':'#fef2f2'};border-radius:10px;border:1px solid ${t.status==='Online'?'#bbf7d0':'#fecaca'}">
    <div style="overflow:hidden"><p style="font-size:12px;font-weight:600;color:#1e293b;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.name}</p><p style="font-size:10px;color:#64748b;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.loc}</p></div>
    ${App.badgeHtml(t.status)}
  </div>`).join('');
}

function loadFeed() {
  const el=$('live-feed'); if(!el) return;
  const {rows}=DB.getAttendance({limit:8});
  el.innerHTML=rows.map(r=>{
    const ok=r.status==='Present';
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:#f8fafc;border:1px solid #f1f5f9">
      <div style="width:28px;height:28px;border-radius:50%;background:${ok?'#dcfce7':'#fef3c7'};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:${ok?'#166534':'#92400e'};flex-shrink:0">${r.avatar||'??'}</div>
      <div style="flex:1;min-width:0"><p style="font-size:12px;font-weight:600;color:#1e293b;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.stuName}</p></div>
      <div style="text-align:right;flex-shrink:0">${App.badgeHtml(r.status)}<p style="font-size:10px;color:#94a3b8;margin:2px 0 0">${App.formatTime(r.checkIn)}</p></div>
    </div>`;
  }).join('');
}

document.addEventListener('keydown',e=>{ if(e.code==='Space'&&stream&&!capturing){e.preventDefault();captureAndRecognize();} });
render();
</script>
</body>
</html>
