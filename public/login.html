<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — College Attendance System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="db.js"></script>
<style>
  *{font-family:'Inter',sans-serif;box-sizing:border-box;}
  .gradient-bg{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f2744 100%);}
  .glass{background:rgba(255,255,255,0.07);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);}
  .role-card{transition:all .2s;cursor:pointer;border:2px solid rgba(255,255,255,0.1);}
  .role-card:hover{transform:translateY(-3px);border-color:rgba(59,130,246,0.5);}
  .role-card.active{border-color:#3b82f6;background:rgba(59,130,246,0.15);}
  .input-field{background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.12);color:white;transition:all .2s;width:100%;}
  .input-field::placeholder{color:rgba(255,255,255,0.3);}
  .input-field:focus{outline:none;border-color:#3b82f6;background:rgba(59,130,246,0.1);}
  .btn-primary{background:linear-gradient(135deg,#3b82f6,#1d4ed8);transition:all .2s;position:relative;overflow:hidden;}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgba(59,130,246,0.4);}
  .btn-primary:active{transform:translateY(0);}
  .quick-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);transition:all .2s;}
  .quick-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.15;pointer-events:none;}
  @media(max-width:640px){.hide-sm{display:none!important}}
</style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  <div class="orb w-96 h-96 bg-blue-500 -top-20 -right-20"></div>
  <div class="orb w-80 h-80 bg-purple-600 -bottom-20 -left-20"></div>
  <div class="orb w-64 h-64 bg-cyan-400 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

  <div class="w-full max-w-md relative z-10">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-blue-600 flex items-center justify-center mx-auto mb-4 shadow-2xl shadow-blue-500/30" style="background:linear-gradient(135deg,#3b82f6,#1d4ed8)">
        <span class="material-symbols-outlined text-white text-3xl">school</span>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">College Attendance System</h1>
      <p class="text-blue-300/70 text-sm mt-1">Facial Recognition Portal</p>
    </div>

    <div class="glass rounded-2xl p-8 shadow-2xl">
      <!-- Tabs -->
      <div class="flex bg-white/5 rounded-xl p-1 mb-7">
        <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-white" style="background:linear-gradient(135deg,#3b82f6,#1d4ed8)">Sign In</button>
        <button id="tab-reg"   onclick="switchTab('reg')"   class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-slate-400">Register</button>
      </div>

      <!-- ── LOGIN ── -->
      <div id="panel-login">
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-blue-300/80 mb-1.5 uppercase tracking-wider">Email</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
              <input id="l-email" type="email" placeholder="you@college.edu" class="input-field rounded-xl pl-11 pr-4 py-3 text-sm"/>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-blue-300/80 mb-1.5 uppercase tracking-wider">Password</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
              <input id="l-pwd" type="password" placeholder="••••••••" class="input-field rounded-xl pl-11 pr-12 py-3 text-sm"/>
              <button onclick="togglePwd('l-pwd')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors">
                <span class="material-symbols-outlined text-xl">visibility</span>
              </button>
            </div>
          </div>
        </div>
        <div id="l-err" class="hidden mt-4 text-sm text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-3 flex items-center gap-2">
          <span class="material-symbols-outlined text-base">error</span><span id="l-err-msg"></span>
        </div>
        <button onclick="doLogin()" class="btn-primary w-full mt-6 text-white font-semibold py-3.5 rounded-xl flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-xl">login</span>
          <span id="l-btn">Sign In</span>
          <span id="l-spin" class="hidden material-symbols-outlined animate-spin">autorenew</span>
        </button>

        <!-- Quick login -->
        <div class="mt-6 pt-5 border-t border-white/10">
          <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Quick Demo Login</p>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="ql('admin@college.edu','Admin@123')" class="quick-btn rounded-xl p-3 text-left">
              <div class="flex items-center gap-2 mb-1"><span class="w-5 h-5 rounded-full bg-blue-500 flex items-center justify-center"><span class="material-symbols-outlined text-white text-xs">admin_panel_settings</span></span><span class="text-blue-400 text-xs font-bold">Admin</span></div>
              <p class="text-slate-400 text-[11px] truncate">admin@college.edu</p>
            </button>
            <button onclick="ql('hod.cs@college.edu','Hod@1234')" class="quick-btn rounded-xl p-3 text-left">
              <div class="flex items-center gap-2 mb-1"><span class="w-5 h-5 rounded-full bg-emerald-500 flex items-center justify-center"><span class="material-symbols-outlined text-white text-xs">manage_accounts</span></span><span class="text-emerald-400 text-xs font-bold">HoD CS</span></div>
              <p class="text-slate-400 text-[11px] truncate">hod.cs@college.edu</p>
            </button>
            <button onclick="ql('faculty1@college.edu','Faculty@123')" class="quick-btn rounded-xl p-3 text-left">
              <div class="flex items-center gap-2 mb-1"><span class="w-5 h-5 rounded-full bg-purple-500 flex items-center justify-center"><span class="material-symbols-outlined text-white text-xs">person_book</span></span><span class="text-purple-400 text-xs font-bold">Faculty</span></div>
              <p class="text-slate-400 text-[11px] truncate">faculty1@college.edu</p>
            </button>
            <button onclick="ql('ethan@college.edu','Student@123')" class="quick-btn rounded-xl p-3 text-left">
              <div class="flex items-center gap-2 mb-1"><span class="w-5 h-5 rounded-full bg-amber-500 flex items-center justify-center"><span class="material-symbols-outlined text-white text-xs">school</span></span><span class="text-amber-400 text-xs font-bold">Student</span></div>
              <p class="text-slate-400 text-[11px] truncate">ethan@college.edu</p>
            </button>
          </div>
        </div>
      </div>

      <!-- ── REGISTER ── -->
      <div id="panel-reg" class="hidden">
        <!-- Role selector -->
        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Select Role</p>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-5">
          <div class="role-card active rounded-xl p-3 text-center" onclick="selRole('student',this)" data-role="student">
            <span class="material-symbols-outlined text-2xl text-amber-400">school</span>
            <p class="text-white text-xs font-semibold mt-1">Student</p>
          </div>
          <div class="role-card rounded-xl p-3 text-center" onclick="selRole('faculty',this)" data-role="faculty">
            <span class="material-symbols-outlined text-2xl text-purple-400">person_book</span>
            <p class="text-white text-xs font-semibold mt-1">Faculty</p>
          </div>
          <div class="role-card rounded-xl p-3 text-center" onclick="selRole('hod',this)" data-role="hod">
            <span class="material-symbols-outlined text-2xl text-emerald-400">manage_accounts</span>
            <p class="text-white text-xs font-semibold mt-1">HoD</p>
          </div>
          <div class="role-card rounded-xl p-3 text-center" onclick="selRole('admin',this)" data-role="admin">
            <span class="material-symbols-outlined text-2xl text-blue-400">admin_panel_settings</span>
            <p class="text-white text-xs font-semibold mt-1">Admin</p>
          </div>
        </div>
        <div class="space-y-3">
          <input id="r-name"  type="text"     placeholder="Full Name *"            class="input-field rounded-xl px-4 py-3 text-sm"/>
          <input id="r-email" type="email"    placeholder="Email Address *"        class="input-field rounded-xl px-4 py-3 text-sm"/>
          <input id="r-pwd"   type="password" placeholder="Password (min 6 chars) *" class="input-field rounded-xl px-4 py-3 text-sm"/>
          <select id="r-dept" class="input-field rounded-xl px-4 py-3 text-sm" style="background:rgba(15,23,42,0.8)">
            <option value="">Select Department *</option>
            <option>Computer Science</option>
            <option>Electrical Engineering</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
            <option>Administration</option>
          </select>
          <input id="r-stuid" type="text" placeholder="Student ID (e.g. CS2410) *" class="input-field rounded-xl px-4 py-3 text-sm"/>
          <input id="r-empid" type="text" placeholder="Employee ID (e.g. FAC003)"  class="input-field rounded-xl px-4 py-3 text-sm hidden"/>
        </div>
        <div id="r-err" class="hidden mt-3 text-sm text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-3 flex items-center gap-2">
          <span class="material-symbols-outlined text-base">error</span><span id="r-err-msg"></span>
        </div>
        <button onclick="doRegister()" class="btn-primary w-full mt-5 text-white font-semibold py-3.5 rounded-xl flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-xl">person_add</span>
          <span id="r-btn">Create Account</span>
          <span id="r-spin" class="hidden material-symbols-outlined animate-spin">autorenew</span>
        </button>
      </div>
    </div>
    <p class="text-center text-slate-600 text-xs mt-5">© 2024 College Attendance System</p>
  </div>

<script>
let selectedRole = 'student';

// Auto-redirect if already logged in
const sess = DB.getSession();
if (sess) window.location.href = sess.role==='student' ? 'student.html' : 'dashboard.html';

function switchTab(t) {
  const isLogin = t==='login';
  document.getElementById('panel-login').classList.toggle('hidden',!isLogin);
  document.getElementById('panel-reg').classList.toggle('hidden',isLogin);
  const lBtn = document.getElementById('tab-login');
  const rBtn = document.getElementById('tab-reg');
  lBtn.className = `flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${isLogin?'text-white':'text-slate-400'}`;
  rBtn.className = `flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${!isLogin?'text-white':'text-slate-400'}`;
  if (isLogin) lBtn.style.background='linear-gradient(135deg,#3b82f6,#1d4ed8)'; else lBtn.style.background='';
  if (!isLogin) rBtn.style.background='linear-gradient(135deg,#3b82f6,#1d4ed8)'; else rBtn.style.background='';
}

function selRole(role, el) {
  selectedRole = role;
  document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  const stu = document.getElementById('r-stuid');
  const emp = document.getElementById('r-empid');
  stu.classList.toggle('hidden', role!=='student');
  emp.classList.toggle('hidden', role==='student'||role==='admin');
}

function togglePwd(id) { const e=document.getElementById(id); e.type=e.type==='password'?'text':'password'; }

function showErr(prefix, msg) {
  document.getElementById(`${prefix}-err`).classList.remove('hidden');
  document.getElementById(`${prefix}-err-msg`).textContent = msg;
}
function hideErr(prefix) { document.getElementById(`${prefix}-err`).classList.add('hidden'); }

function ql(email, pwd) {
  document.getElementById('l-email').value = email;
  document.getElementById('l-pwd').value   = pwd;
  switchTab('login');
  doLogin();
}

function doLogin() {
  hideErr('l');
  const email = document.getElementById('l-email').value.trim();
  const pwd   = document.getElementById('l-pwd').value;
  if (!email||!pwd) { showErr('l','Enter email and password'); return; }
  const btn = document.getElementById('l-btn'); const spin = document.getElementById('l-spin');
  btn.textContent='Signing in…'; spin.classList.remove('hidden');
  setTimeout(() => {
    const user = DB.login(email, pwd);
    btn.textContent='Sign In'; spin.classList.add('hidden');
    if (!user) { showErr('l','Invalid email or password'); return; }
    window.location.href = user.role==='student' ? 'student.html' : 'dashboard.html';
  }, 600);
}

function doRegister() {
  hideErr('r');
  const data = {
    name: document.getElementById('r-name').value.trim(),
    email:document.getElementById('r-email').value.trim(),
    pwd:  document.getElementById('r-pwd').value,
    role: selectedRole,
    dept: document.getElementById('r-dept').value,
    stuId:document.getElementById('r-stuid').value.trim(),
    empId:document.getElementById('r-empid').value.trim(),
  };
  if (!data.name||!data.email||!data.pwd||!data.dept) { showErr('r','Fill all required fields'); return; }
  if (data.pwd.length<6) { showErr('r','Password must be at least 6 characters'); return; }
  if (data.role==='student'&&!data.stuId) { showErr('r','Student ID is required'); return; }
  const btn=document.getElementById('r-btn'); const spin=document.getElementById('r-spin');
  btn.textContent='Creating…'; spin.classList.remove('hidden');
  setTimeout(() => {
    try {
      const user = DB.register(data);
      window.location.href = user.role==='student' ? 'student.html' : 'dashboard.html';
    } catch(e) {
      btn.textContent='Create Account'; spin.classList.add('hidden');
      showErr('r', e.message);
    }
  }, 600);
}

document.addEventListener('keydown', e => { if(e.key==='Enter') { if(!document.getElementById('panel-login').classList.contains('hidden')) doLogin(); else doRegister(); } });
</script>
</body>
</html>
