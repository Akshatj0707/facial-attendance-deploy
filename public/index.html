<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="refresh" content="0; url=login.html"/>
<title>College Attendance System</title>
<script>
  const token = localStorage.getItem('fas_token');
  const user  = localStorage.getItem('fas_user');
  if (token && user) {
    const u = JSON.parse(user);
    window.location.href = u.role === 'student' ? 'student-portal.html' : 'dashboard.html';
  } else {
    window.location.href = 'login.html';
  }
</script>
</head>
<body></body>
</html>
