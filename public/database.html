<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="page-title" content="Database Schema"/><meta name="page-sub" content="MongoDB collection structure &amp; live data"/>
<title>Database</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="db.js"></script><script src="api.js"></script>
<script src="layout.js"></script>
</head>
<body>
<script>
const user = App.init(['admin']);

function render() {
  const students = DB.getStudents({limit:5}).rows;
  const users    = DB.getUsers().slice(0,4);
  const att      = DB.getAttendance({limit:4}).rows;

  document.getElementById('page-content').innerHTML = `
  <div style="max-width:1300px">
    <!-- Header -->
    <div style="background:linear-gradient(135deg,#0f172a,#1e3a5f);border-radius:20px;padding:22px 28px;color:white;margin-bottom:24px;display:flex;align-items:center;gap:16px">
      <div style="width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center">
        <span class="material-symbols-outlined" style="font-size:26px">storage</span>
      </div>
      <div>
        <h2 style="font-size:20px;font-weight:800;margin:0">MongoDB Database Schema</h2>
        <p style="font-size:12px;opacity:.6;margin:4px 0 0">Live data preview • 3 collections • facial_attendance DB</p>
      </div>
      <div style="margin-left:auto;display:flex;gap:10px">
        <div style="background:rgba(16,185,129,.2);border:1px solid rgba(16,185,129,.4);border-radius:10px;padding:8px 16px;text-align:center">
          <p style="font-size:18px;font-weight:800;margin:0">${DB.getStudents({limit:9999}).total}</p>
          <p style="font-size:10px;opacity:.7;margin:0">Students</p>
        </div>
        <div style="background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.4);border-radius:10px;padding:8px 16px;text-align:center">
          <p style="font-size:18px;font-weight:800;margin:0">${DB.getAttendance({limit:1}).total}</p>
          <p style="font-size:10px;opacity:.7;margin:0">Attendance</p>
        </div>
        <div style="background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.4);border-radius:10px;padding:8px 16px;text-align:center">
          <p style="font-size:18px;font-weight:800;margin:0">${DB.getUsers().length}</p>
          <p style="font-size:10px;opacity:.7;margin:0">Users</p>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr;gap:20px">
      <!-- Collection 1: users -->
      ${collCard('users','👥 users','User accounts — all 4 roles','#8b5cf6',
        ['_id','name','email','password','role','department','employeeId','studentId','avatar','isActive','lastLogin','createdAt'],
        ['ObjectId','String','String (unique)','String (bcrypt hashed)','Enum: admin|hod|faculty|student','String','String','String','String','Boolean','Date','Date'],
        users.map(u=>({
          _id: shortId(), name: u.name, email: u.email, password: '****bcrypt****',
          role: u.role, department: u.dept||'—', avatar: u.avatar, isActive: u.active
        }))
      )}

      <!-- Collection 2: students -->
      ${collCard('students','🎓 students','Student academic records + face data','#10b981',
        ['_id','studentId','name','email','department','course','year','bioStatus','avatar','userId','faceData','createdAt'],
        ['ObjectId','String (unique)','String','String','String','String','Number','Enum: Enrolled|Pending|Failed','String','Ref → users','Object {samples[], enrolledAt}','Date'],
        students.map(s=>({
          _id: shortId(), studentId: s.stuId, name: s.name, email: s.email,
          department: s.dept, course: s.course||'—', year: s.year,
          bioStatus: s.bio, avatar: s.avatar,
          faceData: s.bio==='Enrolled' ? '{samples:[5 JPEGs], enrolledAt:...}' : 'null'
        }))
      )}

      <!-- Collection 3: attendance -->
      ${collCard('attendance','📋 attendance','Check-in records with confidence scores','#3b82f6',
        ['_id','student','markedBy','department','course','terminal','checkIn','status','verified','confidence','notes','createdAt'],
        ['ObjectId','Ref → students','Ref → users','String','String','String','Date','Enum: Present|Late|Absent','Boolean','Number (0–1)','String','Date'],
        att.map(a=>({
          _id: shortId(), student: `Ref(${a.avatar})`, markedBy: 'Ref(admin)',
          department: a.dept, course: a.course||'—', terminal: a.terminal,
          checkIn: a.checkIn?.slice(0,16)||'—', status: a.status,
          verified: true, confidence: a.conf||0.95
        }))
      )}
    </div>

    <!-- Indexes -->
    <div class="card" style="padding:22px;margin-top:20px">
      <h3 style="font-size:15px;font-weight:700;color:#0f172a;margin:0 0 16px;display:flex;align-items:center;gap:8px">
        <span class="material-symbols-outlined" style="color:#f59e0b;font-size:20px">speed</span>
        MongoDB Indexes (Performance Optimization)
      </h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">
        ${idxCard('attendance','{ student: 1, checkIn: -1 }','Student attendance lookup')}
        ${idxCard('attendance','{ department: 1, checkIn: -1 }','Dept-wise attendance')}
        ${idxCard('attendance','{ status: 1, checkIn: -1 }','Status filtering')}
        ${idxCard('students','{ studentId: 1 }','Unique student lookup')}
        ${idxCard('students','{ department: 1 }','Dept-wise students')}
        ${idxCard('users','{ email: 1 }','Login authentication')}
        ${idxCard('users','{ role: 1 }','Role-based queries')}
      </div>
    </div>

    <!-- Mongoose connection -->
    <div class="card" style="padding:22px;margin-top:16px;background:#f8fafc">
      <h3 style="font-size:14px;font-weight:700;color:#0f172a;margin:0 0 14px;display:flex;align-items:center;gap:8px">
        <span class="material-symbols-outlined" style="color:#10b981;font-size:18px">integration_instructions</span>
        Mongoose Connection (server.js)
      </h3>
      <pre style="background:#1e293b;color:#e2e8f0;border-radius:12px;padding:18px;font-size:12px;line-height:1.8;overflow-x:auto;margin:0"><code><span style="color:#94a3b8">// .env</span>
MONGO_URI=mongodb+srv://fasadmin:<span style="color:#fcd34d">PASSWORD</span>@cluster0.xxxxx.mongodb.net/facial_attendance
JWT_SECRET=your_super_secret_key
PORT=10000

<span style="color:#94a3b8">// config/db.js</span>
<span style="color:#86efac">const</span> mongoose = <span style="color:#86efac">require</span>(<span style="color:#fcd34d">'mongoose'</span>);
<span style="color:#86efac">await</span> mongoose.<span style="color:#7dd3fc">connect</span>(process.env.MONGO_URI);
<span style="color:#94a3b8">// ✅ Connected to MongoDB Atlas</span></code></pre>
    </div>
  </div>`;
}

function collCard(colName, title, desc, color, fields, types, sampleDocs) {
  return `<div class="card" style="overflow:hidden">
    <div style="background:${color};padding:16px 20px;display:flex;align-items:center;gap:12px">
      <div style="width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center">
        <span class="material-symbols-outlined" style="color:white;font-size:20px">table_chart</span>
      </div>
      <div>
        <h3 style="font-size:15px;font-weight:800;color:white;margin:0;font-family:monospace">${title}</h3>
        <p style="font-size:11px;color:rgba(255,255,255,.7);margin:0">${desc}</p>
      </div>
      <div style="margin-left:auto;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:8px">
        <span style="color:white;font-size:11px;font-weight:700">${fields.length} fields</span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 2fr;border-bottom:2px solid #f1f5f9">
      <!-- Schema -->
      <div style="border-right:1px solid #f1f5f9">
        <div style="padding:10px 16px;background:#f8fafc;border-bottom:1px solid #f1f5f9">
          <p style="font-size:11px;font-weight:700;color:#64748b;margin:0;text-transform:uppercase;letter-spacing:.04em">Schema</p>
        </div>
        <div style="overflow-y:auto;max-height:280px">
          ${fields.map((f,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:1px solid #f8fafc;gap:8px">
            <span style="font-size:12px;font-weight:700;color:#1e293b;font-family:monospace">${f}</span>
            <span style="font-size:10px;color:${color};background:${color}12;padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0">${types[i]}</span>
          </div>`).join('')}
        </div>
      </div>
      <!-- Sample data -->
      <div>
        <div style="padding:10px 16px;background:#f8fafc;border-bottom:1px solid #f1f5f9">
          <p style="font-size:11px;font-weight:700;color:#64748b;margin:0;text-transform:uppercase;letter-spacing:.04em">Sample Documents</p>
        </div>
        <div style="overflow-x:auto;overflow-y:auto;max-height:280px;padding:12px">
          ${sampleDocs.map(doc=>`<div style="background:#1e293b;border-radius:10px;padding:12px;margin-bottom:10px;font-family:monospace;font-size:11px;line-height:1.8">
            <span style="color:#94a3b8">{</span><br>
            ${Object.entries(doc).map(([k,v])=>`&nbsp;&nbsp;<span style="color:#7dd3fc">"${k}"</span>: <span style="color:${typeof v==='boolean'?(v?'#86efac':'#fca5a5'):typeof v==='number'?'#fcd34d':'#e2e8f0'}">${typeof v==='string'?'"'+v+'"':String(v)}</span>`).join(',<br>')}<br>
            <span style="color:#94a3b8">}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function idxCard(col, idx, desc) {
  return `<div style="background:#f8fafc;border-radius:12px;padding:14px;border:1.5px solid #e2e8f0">
    <p style="font-size:10px;font-weight:700;color:#94a3b8;margin:0 0 4px;text-transform:uppercase">${col}</p>
    <p style="font-size:12px;font-family:monospace;font-weight:700;color:#1e293b;margin:0 0 4px">${idx}</p>
    <p style="font-size:11px;color:#64748b;margin:0">${desc}</p>
  </div>`;
}

function shortId() { return 'ObjectId("'+Math.random().toString(36).slice(2,18)+'")'; }

render();
</script>
</body>
</html>
