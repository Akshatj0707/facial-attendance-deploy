<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Student Portal — Attendance System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style> body { font-family: 'Public Sans', sans-serif; } </style>
<script src="auth.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- Header -->
<header class="bg-[#0F172A] text-white px-6 py-4 flex items-center justify-between shadow-lg">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 bg-amber-500 rounded-lg flex items-center justify-center">
      <span class="material-symbols-outlined text-white text-xl">school</span>
    </div>
    <div>
      <h1 class="font-bold text-sm">College Attendance System</h1>
      <p class="text-slate-400 text-[11px]">Student Portal</p>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <div class="text-right hidden sm:block">
      <p class="text-sm font-bold" data-user-name>—</p>
      <p class="text-[11px] text-slate-400" data-user-dept>—</p>
    </div>
    <div class="w-9 h-9 rounded-full bg-amber-500 flex items-center justify-center text-sm font-bold" data-user-avatar>—</div>
    <button data-logout class="text-slate-400 hover:text-white transition-colors ml-2">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>
</header>

<main class="max-w-4xl mx-auto p-6 space-y-6">

  <!-- Welcome Card -->
  <div class="bg-gradient-to-r from-amber-500 to-orange-500 rounded-2xl p-6 text-white shadow-lg">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-amber-100 text-sm font-medium">Welcome back,</p>
        <h2 class="text-2xl font-bold mt-1" data-user-name>Student</h2>
        <p class="text-amber-100 text-sm mt-1" data-user-dept></p>
      </div>
      <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-2xl font-bold" data-user-avatar>—</div>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="grid grid-cols-3 gap-4">
    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100 text-center">
      <p class="text-3xl font-bold text-emerald-600" id="stat-present">—</p>
      <p class="text-slate-500 text-xs mt-1">Days Present</p>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100 text-center">
      <p class="text-3xl font-bold text-amber-500" id="stat-late">—</p>
      <p class="text-slate-500 text-xs mt-1">Late Arrivals</p>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100 text-center">
      <p class="text-3xl font-bold text-blue-600" id="stat-rate">—%</p>
      <p class="text-slate-500 text-xs mt-1">Attendance Rate</p>
    </div>
  </div>

  <!-- Attendance History -->
  <div class="bg-white rounded-xl shadow-sm border border-slate-100">
    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
      <h3 class="font-bold text-slate-900">My Attendance History</h3>
      <span id="total-count" class="text-xs text-slate-400 bg-slate-50 px-2 py-1 rounded-full"></span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
          <tr>
            <th class="px-5 py-3 text-left">Date</th>
            <th class="px-5 py-3 text-left">Time</th>
            <th class="px-5 py-3 text-left">Course</th>
            <th class="px-5 py-3 text-left">Terminal</th>
            <th class="px-5 py-3 text-left">Status</th>
          </tr>
        </thead>
        <tbody id="att-body" class="divide-y divide-slate-100">
          <tr><td colspan="5" class="text-center py-8 text-slate-400">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<script>
Auth.require(['student']);
Auth.fillNavbar();

async function loadMyAttendance() {
  try {
    const res  = await Auth.fetch('/api/attendance?limit=100');
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    const rows  = data.data.rows;
    const total = data.data.total;
    document.getElementById('total-count').textContent = total + ' records';

    const present = rows.filter(r => r.status === 'Present').length;
    const late    = rows.filter(r => r.status === 'Late').length;
    const rate    = total ? Math.round((present + late) / total * 100) : 0;

    document.getElementById('stat-present').textContent = present;
    document.getElementById('stat-late').textContent    = late;
    document.getElementById('stat-rate').textContent    = rate + '%';

    const tbody = document.getElementById('att-body');
    tbody.innerHTML = !rows.length
      ? '<tr><td colspan="5" class="text-center py-8 text-slate-400">No attendance records yet.</td></tr>'
      : rows.map((r,i) => {
          const dt  = new Date(r.checkIn);
          const ds  = dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
          const ts  = dt.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
          const badge = r.status==='Present'?'bg-emerald-100 text-emerald-700':r.status==='Late'?'bg-amber-100 text-amber-700':'bg-red-100 text-red-700';
          return `<tr class="${i%2?'bg-slate-50/40':''}">
            <td class="px-5 py-3.5 text-slate-700 font-medium">${ds}</td>
            <td class="px-5 py-3.5 text-slate-600">${ts}</td>
            <td class="px-5 py-3.5 text-slate-600">${r.course||'—'}</td>
            <td class="px-5 py-3.5 text-slate-600">${r.terminal||'—'}</td>
            <td class="px-5 py-3.5"><span class="px-2.5 py-1 rounded-full text-[11px] font-semibold ${badge}">${r.status}</span></td>
          </tr>`;
        }).join('');
  } catch(e) {
    document.getElementById('att-body').innerHTML =
      `<tr><td colspan="5" class="text-center py-8 text-red-400">${e.message}</td></tr>`;
  }
}

loadMyAttendance();
</script>
</body>
</html>
