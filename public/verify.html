<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="page-title" content="Verify Students"/><meta name="page-sub" content="Approve or reject pending student registrations"/>
<title>Verify Students</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="api.js"></script><script src="layout.js"></script>
</head>
<body>
<script>
const user = App.init(['admin','hod']);

async function render() {
  document.getElementById('page-content').innerHTML = `
  <div style="max-width:900px">
    <div class="card" style="overflow:hidden">
      <div style="padding:16px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:12px">
        <div style="width:38px;height:38px;border-radius:10px;background:#fef3c7;display:flex;align-items:center;justify-content:center">
          <span class="material-symbols-outlined" style="color:#f59e0b;font-size:20px">pending_actions</span>
        </div>
        <div>
          <h3 style="font-size:14px;font-weight:700;color:#0f172a;margin:0">Pending Student Verifications</h3>
          <p style="font-size:12px;color:#94a3b8;margin:0">Students waiting for account approval</p>
        </div>
        <button onclick="loadPending()" style="margin-left:auto;border:none;background:#f1f5f9;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px">
          <span class="material-symbols-outlined" style="font-size:15px">refresh</span>Refresh
        </button>
      </div>
      <div id="pending-body" style="min-height:120px;display:flex;align-items:center;justify-content:center">
        <p style="color:#94a3b8;font-size:13px">Loading…</p>
      </div>
    </div>
  </div>`;
  loadPending();
}

async function loadPending() {
  const el = document.getElementById('pending-body');
  el.innerHTML = '<p style="color:#94a3b8;font-size:13px;padding:40px">Loading…</p>';
  const data = await Api.getPendingStudents();
  if (!data?.success) { el.innerHTML = `<p style="color:#ef4444;font-size:13px;padding:40px">Error: ${data?.error}</p>`; return; }
  const students = data.data;
  if (!students.length) {
    el.innerHTML = `<div style="text-align:center;padding:50px">
      <span class="material-symbols-outlined" style="font-size:48px;color:#10b981">check_circle</span>
      <p style="font-size:14px;font-weight:600;color:#374151;margin:12px 0 4px">All caught up!</p>
      <p style="font-size:12px;color:#94a3b8;margin:0">No pending student verifications</p>
    </div>`;
    return;
  }
  el.innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr>
      <th>Student</th><th>Email</th><th>Department</th><th>Student ID</th><th>Registered</th><th>Actions</th>
    </tr></thead>
    <tbody>${students.map(s => `<tr>
      <td><div style="display:flex;align-items:center;gap:10px">
        <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;font-weight:700;color:white;font-size:11px;flex-shrink:0">${s.avatar||s.name?.slice(0,2).toUpperCase()}</div>
        <p style="font-size:13px;font-weight:600;color:#1e293b;margin:0">${s.name}</p>
      </div></td>
      <td style="font-size:12px;color:#64748b">${s.email}</td>
      <td style="font-size:12px;color:#374151">${s.department||'—'}</td>
      <td><span style="font-family:monospace;font-size:12px;background:#f1f5f9;padding:2px 8px;border-radius:6px">${s.studentId||'—'}</span></td>
      <td style="font-size:11px;color:#94a3b8">${new Date(s.createdAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</td>
      <td><div style="display:flex;gap:8px">
        <button onclick="verifyStudent('${s._id}','${s.name}')" style="padding:6px 14px;background:linear-gradient(135deg,#10b981,#059669);color:white;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px">
          <span class="material-symbols-outlined" style="font-size:14px">check</span>Verify
        </button>
        ${user.role==='admin'?`<button onclick="rejectStudent('${s._id}','${s.name}')" style="padding:6px 14px;background:#fee2e2;color:#ef4444;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px">
          <span class="material-symbols-outlined" style="font-size:14px">close</span>Reject
        </button>`:''}
      </div></td>
    </tr>`).join('')}
    </tbody>
  </table></div>`;
}

async function verifyStudent(id, name) {
  App.modal('Verify Student', `<div style="text-align:center;padding:10px"><span class="material-symbols-outlined" style="font-size:44px;color:#10b981">how_to_reg</span><p style="font-size:14px;color:#374151;margin:12px 0">Approve <strong>${name}</strong> as a verified student?<br><span style="font-size:12px;color:#94a3b8">They will gain full access to the system.</span></p></div>`, async () => {
    const r = await Api.verifyStudent(id);
    App.toast(r?.message || `${name} verified!`, 'success');
    loadPending();
  });
}

async function rejectStudent(id, name) {
  App.modal('Reject Student', `<p style="color:#ef4444;font-size:14px">Permanently reject and delete <strong>${name}</strong>'s account? This cannot be undone.</p>`, async () => {
    const r = await Api.rejectStudent(id);
    App.toast(r?.message || `${name} rejected`, 'info');
    loadPending();
  });
}

render();
</script>
</body>
</html>
