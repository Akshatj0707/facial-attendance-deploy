<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="page-title" content="My Dashboard"/><meta name="page-sub" content="Your attendance & academic overview"/>
<title>Student Dashboard — Attendance System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="db.js"></script><script src="layout.js"></script>
</head>
<body>
<script>
const user = App.init(['student']);

function render() {
  // Find student record
  const students = DB.getStudents({}).rows;
  const stuRecord = students.find(s=>s.userId===user.id || s.email===user.email || s.stuId===user.stuId);
  const {rows:attRows, total} = stuRecord ? DB.getAttendance({stuRef:stuRecord.id, limit:500}) : {rows:[],total:0};

  const present = attRows.filter(r=>r.status==='Present').length;
  const late    = attRows.filter(r=>r.status==='Late').length;
  const absent  = total - present - late;
  const rate    = total ? Math.round((present+late)/total*100) : 0;
  const today   = new Date().toISOString().split('T')[0];
  const todayRec= attRows.find(r=>r.checkIn.startsWith(today));
  const rc      = App.ROLE_CONFIG.student;

  // 7-day mini trend
  const days=[]; for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().split('T')[0]);}
  const trend = days.map(day=>({ day:day.slice(5), rec:attRows.find(r=>r.checkIn.startsWith(day)) }));

  document.getElementById('page-content').innerHTML = `
  <div style="max-width:1000px">
    <!-- Hero card -->
    <div style="background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);border-radius:20px;padding:24px 28px;color:white;margin-bottom:20px;position:relative;overflow:hidden">
      <div style="position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.05)"></div>
      <div style="position:absolute;right:80px;bottom:-50px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.04)"></div>
      <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
        <div style="width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:white;flex-shrink:0">${user.avatar||user.name?.slice(0,2).toUpperCase()}</div>
        <div style="flex:1">
          <p style="margin:0;font-size:12px;opacity:.7">Welcome back</p>
          <h2 style="margin:4px 0 2px;font-size:22px;font-weight:800">${user.name}</h2>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
            ${stuRecord?`<span style="background:rgba(255,255,255,.15);border-radius:8px;padding:3px 10px;font-size:11px">${stuRecord.stuId}</span>
            <span style="background:rgba(255,255,255,.15);border-radius:8px;padding:3px 10px;font-size:11px">${stuRecord.dept}</span>
            <span style="background:rgba(255,255,255,.15);border-radius:8px;padding:3px 10px;font-size:11px">${stuRecord.course||'—'} · Year ${stuRecord.year}</span>`:''}
          </div>
        </div>
        <!-- Today status -->
        <div style="text-align:center;background:rgba(255,255,255,.1);border-radius:14px;padding:14px 18px;flex-shrink:0">
          ${todayRec
            ? `<div style="font-size:28px">✅</div><p style="margin:4px 0 0;font-size:12px;font-weight:700;color:${todayRec.status==='Present'?'#86efac':'#fcd34d'}">${todayRec.status} Today</p><p style="margin:0;font-size:11px;opacity:.6">${App.formatTime(todayRec.checkIn)}</p>`
            : `<div style="font-size:28px">⏰</div><p style="margin:4px 0 0;font-size:12px;opacity:.8">Not marked yet</p><p style="margin:0;font-size:11px;opacity:.5">${new Date().toLocaleDateString()}</p>`
          }
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px">
      ${stuStat('Attendance Rate', rate+'%', rate>=85?'#10b981':rate>=75?'#f59e0b':'#ef4444', 'trending_up')}
      ${stuStat('Days Present', present, '#10b981','check_circle')}
      ${stuStat('Late Arrivals', late, '#f59e0b','schedule')}
      ${stuStat('Total Records', total, '#3b82f6','list_alt')}
    </div>

    <!-- Donut + 7-day trend -->
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:16px;margin-bottom:20px" class="mid-grid">
      <div class="card" style="padding:20px;text-align:center">
        <h3 style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 12px">My Attendance</h3>
        ${App.donut(rate, rate>=85?'#10b981':rate>=75?'#f59e0b':'#ef4444', 110)}
        <p style="font-size:12px;color:#64748b;margin:8px 0 0">${rate>=85?'🌟 Excellent!':rate>=75?'👍 Good':'⚠️ Needs attention'}</p>
        <p style="font-size:11px;color:#94a3b8;margin:4px 0 0">${present+late} of ${total} attended</p>
      </div>
      <div class="card" style="padding:20px">
        <h3 style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 14px">Last 7 Days</h3>
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
          ${trend.map(t=>{
            const color=!t.rec?'#f1f5f9':t.rec.status==='Present'?'#10b981':t.rec.status==='Late'?'#f59e0b':'#ef4444';
            const label=!t.rec?'—':t.rec.status[0];
            return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
              <div style="width:36px;height:36px;border-radius:10px;background:${color};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${color==='#f1f5f9'?'#94a3b8':'white'}">${label}</div>
              <span style="font-size:9px;color:#94a3b8;font-weight:600">${t.day}</span>
            </div>`;
          }).join('')}
        </div>
        <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">
          ${['#10b981:Present','#f59e0b:Late','#ef4444:Absent','#f1f5f9:No Record'].map(c=>{
            const [color,label]=c.split(':');
            return `<div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:10px;border-radius:3px;background:${color};border:1px solid ${color==='#f1f5f9'?'#e2e8f0':color}"></div><span style="font-size:11px;color:#64748b">${label}</span></div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <!-- Quick links -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px">
      ${quickLink('My Attendance','my-attendance.html','list_alt','#3b82f6','View all your attendance records')}
      ${quickLink('Timetable','timetable.html','calendar_month','#10b981','Check your class schedule')}
      ${quickLink('Announcements','announcements.html','campaign','#f59e0b','Latest notices from admin')}
      ${quickLink('My Profile','profile.html','person','#8b5cf6','Update your information')}
    </div>

    <!-- Recent attendance -->
    <div class="card" style="overflow:hidden">
      <div style="padding:14px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between">
        <h3 style="font-size:14px;font-weight:700;color:#0f172a;margin:0">Recent Attendance</h3>
        <a href="my-attendance.html" style="font-size:12px;color:#3b82f6;font-weight:600;text-decoration:none">View all →</a>
      </div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Date</th><th>Time</th><th>Course</th><th>Terminal</th><th>Status</th></tr></thead>
        <tbody>
          ${attRows.slice(0,8).map((r,i)=>`<tr>
            <td style="font-size:13px;font-weight:600;color:#374151">${App.formatDate(r.checkIn)}</td>
            <td style="font-size:13px;font-weight:600;color:#374151">${App.formatTime(r.checkIn)}</td>
            <td><span style="background:#f1f5f9;padding:2px 8px;border-radius:6px;font-size:12px">${r.course||'—'}</span></td>
            <td style="font-size:12px;color:#64748b">${r.terminal||'—'}</td>
            <td>${App.badgeHtml(r.status)}</td>
          </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;padding:30px;color:#94a3b8;font-size:13px">No attendance records yet</td></tr>'}
        </tbody>
      </table></div>
    </div>
  </div>
  <style>@media(max-width:640px){.mid-grid{grid-template-columns:1fr!important}}</style>`;
}

function stuStat(label,val,color,icon){
  return `<div style="background:white;border-radius:14px;padding:16px;border:1px solid #f1f5f9;border-left:4px solid ${color}">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span class="material-symbols-outlined" style="color:${color};font-size:18px">${icon}</span>
      <p style="font-size:11px;color:#64748b;margin:0;font-weight:600;text-transform:uppercase;letter-spacing:.04em">${label}</p>
    </div>
    <p style="font-size:24px;font-weight:800;color:#0f172a;margin:0">${val}</p>
  </div>`;
}

function quickLink(label,href,icon,color,sub){
  return `<a href="${href}" style="text-decoration:none;background:white;border-radius:14px;padding:16px;border:1px solid #f1f5f9;display:flex;align-items:center;gap:12px;transition:all .2s"
    onmouseover="this.style.boxShadow='0 4px 20px rgba(0,0,0,.08)';this.style.borderColor='${color}40'"
    onmouseout="this.style.boxShadow='none';this.style.borderColor='#f1f5f9'">
    <div style="width:40px;height:40px;border-radius:12px;background:${color}18;display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <span class="material-symbols-outlined" style="color:${color};font-size:20px">${icon}</span>
    </div>
    <div><p style="font-size:13px;font-weight:700;color:#0f172a;margin:0">${label}</p><p style="font-size:11px;color:#94a3b8;margin:0">${sub}</p></div>
    <span class="material-symbols-outlined" style="margin-left:auto;color:#cbd5e1;font-size:18px">chevron_right</span>
  </a>`;
}

render();
</script>
</body>
</html>
