<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="page-title" content="Face Enrollment"/>
<meta name="page-sub" content="Capture & register student face data"/>
<title>Face Enrollment — Attendance System</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<script src="db.js"></script>
<script src="layout.js"></script>
</head>
<body>
<script>
const user = App.init(['admin','hod','faculty']);
const deptF = user?.role==='admin' ? null : user?.dept;

// Check if pre-selected student from URL
const params = new URLSearchParams(location.search);
const preselId = params.get('id');

let stream = null, modelsLoaded = false, capturedSamples = [], selectedStudentId = null;
const MAX_SAMPLES = 5;

function render() {
  document.getElementById('page-content').innerHTML = `
  <div style="max-width:1100px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start" class="enroll-grid">

      <!-- Left: Camera panel -->
      <div>
        <div class="card" style="overflow:hidden">
          <div style="padding:18px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px">
            <div style="width:36px;height:36px;border-radius:10px;background:#dbeafe;display:flex;align-items:center;justify-content:center">
              <span class="material-symbols-outlined" style="color:#3b82f6;font-size:20px">videocam</span>
            </div>
            <div>
              <h3 style="font-size:14px;font-weight:700;color:#0f172a;margin:0">Face Camera</h3>
              <p style="font-size:11px;color:#94a3b8;margin:0">Capture multiple angles</p>
            </div>
            <div id="cam-status" style="margin-left:auto;display:flex;align-items:center;gap:6px">
              <span id="status-dot" style="width:8px;height:8px;border-radius:50%;background:#94a3b8"></span>
              <span id="status-txt" style="font-size:11px;color:#94a3b8;font-weight:600">OFFLINE</span>
            </div>
          </div>

          <!-- Camera view -->
          <div style="position:relative;background:#0f172a;aspect-ratio:4/3;overflow:hidden">
            <!-- Placeholder -->
            <div id="cam-placeholder" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
              <div style="width:80px;height:80px;border-radius:50%;border:3px dashed #334155;display:flex;align-items:center;justify-content:center">
                <span class="material-symbols-outlined" style="font-size:36px;color:#475569">face_unlock</span>
              </div>
              <p style="font-size:12px;color:#475569;margin:0">Camera not started</p>
              <button onclick="startCamera()" class="btn btn-primary" style="font-size:12px;padding:8px 16px">
                <span class="material-symbols-outlined" style="font-size:16px">videocam</span>Start Camera
              </button>
            </div>
            <video id="cam-video" autoplay muted playsinline style="width:100%;height:100%;object-fit:cover;display:none;transform:scaleX(-1)"></video>
            <canvas id="cam-canvas" style="position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none;display:none"></canvas>

            <!-- Face guide overlay -->
            <div id="face-guide" style="position:absolute;inset:0;display:none;pointer-events:none">
              <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);width:45%;aspect-ratio:3/4">
                <div style="width:100%;height:100%;border:2px dashed rgba(59,130,246,.6);border-radius:50%;"></div>
                <p id="guide-text" style="position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-size:11px;color:#93c5fd;white-space:nowrap;font-weight:600">POSITION FACE IN OVAL</p>
              </div>
            </div>

            <!-- Capture flash -->
            <div id="cap-flash" style="position:absolute;inset:0;background:white;opacity:0;pointer-events:none;transition:opacity .1s"></div>

            <!-- Sample counter -->
            <div id="sample-counter" style="position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.7);border-radius:8px;padding:6px 12px;display:none">
              <span id="counter-text" style="color:white;font-size:12px;font-weight:700">0 / ${MAX_SAMPLES}</span>
            </div>
          </div>

          <!-- Controls -->
          <div style="padding:14px 16px;display:flex;gap:8px;flex-wrap:wrap">
            <button id="btn-start" onclick="startCamera()" class="btn btn-primary" style="flex:1;justify-content:center;font-size:12px">
              <span class="material-symbols-outlined" style="font-size:16px">videocam</span>Start
            </button>
            <button id="btn-capture" onclick="captureFrame()" class="btn btn-secondary" style="flex:1;justify-content:center;font-size:12px" disabled>
              <span class="material-symbols-outlined" style="font-size:16px">camera</span>Capture
            </button>
            <button id="btn-stop" onclick="stopCamera()" class="btn btn-secondary" style="flex:1;justify-content:center;font-size:12px" disabled>
              <span class="material-symbols-outlined" style="font-size:16px">videocam_off</span>Stop
            </button>
          </div>
        </div>

        <!-- Captured samples -->
        <div class="card" style="margin-top:16px;padding:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <h3 style="font-size:13px;font-weight:700;color:#0f172a;margin:0">Captured Samples</h3>
            <span id="samples-count" style="font-size:11px;color:#94a3b8">0 / ${MAX_SAMPLES}</span>
          </div>
          <div id="samples-grid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
            ${Array(MAX_SAMPLES).fill(0).map((_,i)=>`<div id="sample-slot-${i}" style="aspect-ratio:1;border-radius:10px;border:2px dashed #e2e8f0;background:#f8fafc;display:flex;align-items:center;justify-content:center">
              <span class="material-symbols-outlined" style="font-size:20px;color:#cbd5e1">add_photo_alternate</span>
            </div>`).join('')}
          </div>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button onclick="clearSamples()" class="btn btn-secondary" style="font-size:12px">
              <span class="material-symbols-outlined" style="font-size:15px">clear_all</span>Clear
            </button>
            <button onclick="enrollFace()" id="btn-enroll" class="btn btn-primary" style="flex:1;justify-content:center;font-size:12px" disabled>
              <span class="material-symbols-outlined" style="font-size:16px">how_to_reg</span>Enroll Face Data
            </button>
          </div>
        </div>
      </div>

      <!-- Right: Student selector + enrolled list -->
      <div>
        <!-- Student selector -->
        <div class="card" style="padding:20px;margin-bottom:16px">
          <h3 style="font-size:14px;font-weight:700;color:#0f172a;margin:0 0 14px">Select Student to Enroll</h3>
          <div style="position:relative;margin-bottom:12px">
            <span class="material-symbols-outlined" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:18px">search</span>
            <input id="stu-search" type="text" placeholder="Search by name or ID…" oninput="renderStudentList()"
              style="padding-left:38px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding-top:9px;padding-bottom:9px;font-size:13px;color:#1e293b;width:100%"/>
          </div>
          <div id="stu-list" style="max-height:300px;overflow-y:auto;border:1.5px solid #f1f5f9;border-radius:12px"></div>
        </div>

        <!-- Selected student card -->
        <div id="selected-card" style="display:none" class="card" style="padding:20px;margin-bottom:16px;border:2px solid #bfdbfe;background:#f0f9ff">
        </div>

        <!-- Instructions -->
        <div class="card" style="padding:20px;background:linear-gradient(135deg,#f0f9ff,#e0f2fe)">
          <h3 style="font-size:13px;font-weight:700;color:#0f172a;margin:0 0 10px;display:flex;align-items:center;gap:6px">
            <span class="material-symbols-outlined" style="color:#3b82f6;font-size:18px">info</span>
            Enrollment Instructions
          </h3>
          <ol style="padding-left:16px;margin:0;font-size:12px;color:#374151;line-height:1.8">
            <li>Select a student from the list</li>
            <li>Start the camera</li>
            <li>Ask student to look at camera</li>
            <li>Capture <strong>${MAX_SAMPLES} samples</strong> at different angles</li>
            <li>Click <strong>Enroll Face Data</strong></li>
            <li>Status updates to <strong>Enrolled ✅</strong></li>
          </ol>
          <div style="margin-top:12px;padding:10px;background:rgba(59,130,246,.1);border-radius:8px;border-left:3px solid #3b82f6">
            <p style="font-size:11px;color:#1e40af;margin:0;font-weight:500">💡 Tip: Capture front, left tilt, right tilt, up, and down for best recognition accuracy.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <style>
    @media(max-width:768px){.enroll-grid{grid-template-columns:1fr!important}}
  </style>`;

  renderStudentList();
  loadModels();
  if (preselId) selectStudent(preselId);
}

function renderStudentList() {
  const q   = document.getElementById('stu-search')?.value||'';
  const opts = deptF ? {dept:deptF} : {};
  if (q) opts.search = q;
  const { rows } = DB.getStudents({...opts, limit:30});
  const el = document.getElementById('stu-list');
  if (!el) return;
  el.innerHTML = rows.map(s => `
    <div onclick="selectStudent('${s.id}')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9;transition:background .15s;${selectedStudentId===s.id?'background:#eff6ff;':''}"
      onmouseover="if('${s.id}'!=='${selectedStudentId}')this.style.background='#f8fafc'" onmouseout="if('${s.id}'!=='${selectedStudentId}')this.style.background='white'">
      <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;color:white;font-size:11px;flex-shrink:0">${s.avatar}</div>
      <div style="flex:1;overflow:hidden">
        <p style="font-size:13px;font-weight:600;color:#1e293b;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.name}</p>
        <p style="font-size:11px;color:#94a3b8;margin:0">${s.stuId} · ${s.dept.split(' ')[0]}</p>
      </div>
      ${App.badgeHtml(s.bio||'Pending')}
      ${selectedStudentId===s.id?'<span class="material-symbols-outlined" style="color:#3b82f6;font-size:18px">check_circle</span>':''}
    </div>`).join('') || '<p style="text-align:center;padding:20px;font-size:13px;color:#94a3b8">No students found</p>';
}

function selectStudent(id) {
  selectedStudentId = id;
  const students = DB.getStudents({}).rows;
  const s = students.find(x=>x.id===id);
  if (!s) return;
  renderStudentList();
  const card = document.getElementById('selected-card');
  card.style.display = 'block';
  card.style.cssText += ';padding:16px 18px;margin-bottom:16px;border:2px solid #bfdbfe;background:#f0f9ff;border-radius:16px';
  card.innerHTML = `
    <p style="font-size:11px;font-weight:700;color:#3b82f6;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px">Selected Student</p>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;color:white;font-size:16px">${s.avatar}</div>
      <div>
        <h4 style="font-size:14px;font-weight:700;color:#0f172a;margin:0">${s.name}</h4>
        <p style="font-size:12px;color:#64748b;margin:2px 0 0">${s.stuId} · ${s.dept}</p>
      </div>
      ${App.badgeHtml(s.bio||'Pending')}
    </div>`;
}

async function loadModels() {
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
    modelsLoaded = true;
  } catch(e) { modelsLoaded = false; }
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    const vid = document.getElementById('cam-video');
    vid.srcObject = stream; vid.style.display='block';
    document.getElementById('cam-placeholder').style.display = 'none';
    document.getElementById('cam-canvas').style.display = 'block';
    document.getElementById('face-guide').style.display = 'block';
    document.getElementById('sample-counter').style.display = 'block';
    document.getElementById('btn-capture').disabled = false;
    document.getElementById('btn-stop').disabled = false;
    document.getElementById('btn-start').disabled = true;
    setStatus('online','ACTIVE');
    startDetect();
  } catch(e) {
    App.toast('Camera error: ' + e.message, 'error');
  }
}

let detectLoop = null;
function startDetect() {
  const vid = document.getElementById('cam-video');
  const cvs = document.getElementById('cam-canvas');
  if (!vid||!cvs) return;
  cvs.width = vid.videoWidth||640; cvs.height = vid.videoHeight||480;
  const ctx = cvs.getContext('2d');
  async function loop() {
    if (!stream) return;
    ctx.clearRect(0,0,cvs.width,cvs.height);
    if (modelsLoaded && vid.readyState>=2) {
      try {
        const dets = await faceapi.detectAllFaces(vid, new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:0.5}));
        const gt = document.getElementById('guide-text');
        if (dets.length) {
          gt.textContent = capturedSamples.length>=MAX_SAMPLES ? '✅ SAMPLES COMPLETE' : `FACE DETECTED — Press CAPTURE (${capturedSamples.length}/${MAX_SAMPLES})`;
          gt.style.color = '#86efac';
          const sx = cvs.width/(vid.videoWidth||1), sy = cvs.height/(vid.videoHeight||1);
          dets.forEach(d=>{
            const {x,y,width:w,height:h} = d.box;
            ctx.strokeStyle='#10b981'; ctx.lineWidth=2.5;
            ctx.shadowBlur=12; ctx.shadowColor='#10b981';
            const cs=18, bx=x*sx, by=y*sy, bw=w*sx, bh=h*sy;
            ctx.beginPath();
            [[bx,by,cs,0,0,cs],[bx+bw,by,-cs,0,0,cs],[bx,by+bh,cs,0,0,-cs],[bx+bw,by+bh,-cs,0,0,-cs]]
              .forEach(([ox,oy,dx1,dy1,dx2,dy2])=>{ctx.moveTo(ox+dx1,oy+dy1);ctx.lineTo(ox,oy);ctx.lineTo(ox+dx2,oy+dy2)});
            ctx.stroke(); ctx.shadowBlur=0;
          });
        } else {
          gt.textContent = 'POSITION FACE IN OVAL';
          gt.style.color = '#93c5fd';
        }
      } catch(e){}
    }
    detectLoop = requestAnimationFrame(loop);
  }
  loop();
}

function captureFrame() {
  if (!stream) return;
  if (!selectedStudentId) { App.toast('Select a student first!', 'warning'); return; }
  if (capturedSamples.length >= MAX_SAMPLES) { App.toast('Maximum samples reached', 'info'); return; }
  const vid = document.getElementById('cam-video');
  const snap = document.createElement('canvas');
  snap.width = vid.videoWidth||640; snap.height = vid.videoHeight||480;
  snap.getContext('2d').drawImage(vid,0,0);
  const dataUrl = snap.toDataURL('image/jpeg',0.7);
  capturedSamples.push(dataUrl);

  // Flash
  const fl = document.getElementById('cap-flash');
  fl.style.opacity='0.8'; setTimeout(()=>fl.style.opacity='0',100);

  // Update slot
  const slot = document.getElementById(`sample-slot-${capturedSamples.length-1}`);
  if (slot) {
    slot.style.border='2px solid #10b981';
    slot.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:8px"/>`;
  }
  document.getElementById('samples-count').textContent = `${capturedSamples.length} / ${MAX_SAMPLES}`;
  document.getElementById('counter-text').textContent  = `${capturedSamples.length} / ${MAX_SAMPLES}`;

  if (capturedSamples.length >= MAX_SAMPLES) {
    document.getElementById('btn-enroll').disabled = false;
    App.toast(`${MAX_SAMPLES} samples captured! Click Enroll Face Data.`, 'success');
  }
}

function clearSamples() {
  capturedSamples = [];
  document.getElementById('btn-enroll').disabled = true;
  document.getElementById('samples-count').textContent = `0 / ${MAX_SAMPLES}`;
  document.getElementById('counter-text').textContent  = `0 / ${MAX_SAMPLES}`;
  for (let i=0;i<MAX_SAMPLES;i++) {
    const slot = document.getElementById(`sample-slot-${i}`);
    if (slot) { slot.style.border='2px dashed #e2e8f0'; slot.innerHTML=`<span class="material-symbols-outlined" style="font-size:20px;color:#cbd5e1">add_photo_alternate</span>`; }
  }
}

function stopCamera() {
  if (detectLoop) cancelAnimationFrame(detectLoop);
  if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
  document.getElementById('cam-video').style.display='none';
  document.getElementById('cam-canvas').style.display='none';
  document.getElementById('face-guide').style.display='none';
  document.getElementById('sample-counter').style.display='none';
  document.getElementById('cam-placeholder').style.display='flex';
  document.getElementById('btn-start').disabled=false;
  document.getElementById('btn-capture').disabled=true;
  document.getElementById('btn-stop').disabled=true;
  setStatus('offline','OFFLINE');
}

function enrollFace() {
  if (!selectedStudentId) { App.toast('Select a student!','warning'); return; }
  if (capturedSamples.length<MAX_SAMPLES) { App.toast(`Need ${MAX_SAMPLES} samples`,'warning'); return; }
  // Save face data in localStorage (in real system, would send to ML backend)
  const faceData = { studentId:selectedStudentId, samples:capturedSamples, enrolledAt:new Date().toISOString(), sampleCount:capturedSamples.length };
  const allFace = JSON.parse(localStorage.getItem('fas_face_data')||'{}');
  allFace[selectedStudentId] = faceData;
  localStorage.setItem('fas_face_data', JSON.stringify(allFace));
  // Update student bio status
  DB.updateStudent(selectedStudentId, {bio:'Enrolled'});
  App.toast('Face enrolled successfully! Status → Enrolled ✅', 'success');
  clearSamples();
  stopCamera();
  renderStudentList();
  const card = document.getElementById('selected-card');
  if (card) { const badge = card.querySelector('.badge'); if(badge){badge.className='badge badge-green';badge.textContent='Enrolled';} }
}

function setStatus(state, txt) {
  const dot = document.getElementById('status-dot');
  const t   = document.getElementById('status-txt');
  if (dot) dot.style.background = state==='online'?'#10b981':'#94a3b8';
  if (t)   t.style.color = state==='online'?'#10b981':'#94a3b8';
  if (dot&&state==='online') dot.style.animation='pulse 1.5s infinite';
  if (t)   t.textContent = txt;
}

render();
</script>
<style>
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</body>
</html>
