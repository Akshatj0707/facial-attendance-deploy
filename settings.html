<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="page-title" content="Settings"/><meta name="page-sub" content="System configuration"/>
<title>Settings</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="db.js"></script><script src="api.js"></script>
<script src="layout.js"></script>
</head>
<body>
<script>
const user = App.init(['admin']);

function getSysSettings() {
  const d = { collegeName:'National Institute of Technology', collegeShort:'NIT', academicYear:'2024-25', attendanceThreshold:75, lateGraceMinutes:10, maxAbsent:5, emailNotify:true, autoMarkAbsent:false, requireBiometric:true };
  return { ...d, ...(JSON.parse(localStorage.getItem('fas_settings')||'{}')) };
}

function render() {
  const s = getSysSettings();
  document.getElementById('page-content').innerHTML = `
  <div style="max-width:900px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px" class="sets-grid">

      <!-- College Info -->
      <div class="card" style="padding:22px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
          <div style="width:36px;height:36px;border-radius:10px;background:#dbeafe;display:flex;align-items:center;justify-content:center"><span class="material-symbols-outlined" style="color:#3b82f6;font-size:20px">school</span></div>
          <h3 style="font-size:14px;font-weight:700;color:#0f172a;margin:0">College Information</h3>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px">
          ${sf('College Name', 's-cname', s.collegeName, 'text', 'e.g. National Institute of Technology')}
          ${sf('Short Name / Abbreviation', 's-cshort', s.collegeShort, 'text', 'e.g. NIT')}
          ${sf('Academic Year', 's-year', s.academicYear, 'text', 'e.g. 2024-25')}
        </div>
      </div>

      <!-- Attendance Rules -->
      <div class="card" style="padding:22px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
          <div style="width:36px;height:36px;border-radius:10px;background:#d1fae5;display:flex;align-items:center;justify-content:center"><span class="material-symbols-outlined" style="color:#10b981;font-size:20px">rule</span></div>
          <h3 style="font-size:14px;font-weight:700;color:#0f172a;margin:0">Attendance Rules</h3>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px">
          ${sf('Minimum Attendance % (threshold)', 's-thresh', s.attendanceThreshold, 'number', '75')}
          ${sf('Late Grace Period (minutes)', 's-grace', s.lateGraceMinutes, 'number', '10')}
          ${sf('Max Consecutive Absences Alert', 's-maxabs', s.maxAbsent, 'number', '5')}
        </div>
      </div>

      <!-- Notifications -->
      <div class="card" style="padding:22px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
          <div style="width:36px;height:36px;border-radius:10px;background:#fef3c7;display:flex;align-items:center;justify-content:center"><span class="material-symbols-outlined" style="color:#f59e0b;font-size:20px">notifications</span></div>
          <h3 style="font-size:14px;font-weight:700;color:#0f172a;margin:0">System Features</h3>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px">
          ${toggle('s-email', 'Email Notifications', 'Send alerts for low attendance', s.emailNotify)}
          ${toggle('s-autoabs', 'Auto-mark Absent', 'Mark absent if not checked in by 2PM', s.autoMarkAbsent)}
          ${toggle('s-bioreq', 'Require Biometric', 'Students must enroll face before attendance', s.requireBiometric)}
        </div>
      </div>

      <!-- Data Management -->
      <div class="card" style="padding:22px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
          <div style="width:36px;height:36px;border-radius:10px;background:#fce7f3;display:flex;align-items:center;justify-content:center"><span class="material-symbols-outlined" style="color:#ec4899;font-size:20px">storage</span></div>
          <h3 style="font-size:14px;font-weight:700;color:#0f172a;margin:0">Data Management</h3>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button onclick="exportAllData()" class="btn btn-secondary" style="justify-content:flex-start">
            <span class="material-symbols-outlined" style="font-size:18px;color:#3b82f6">download</span>Export All Data (JSON)
          </button>
          <button onclick="exportCSVAll()" class="btn btn-secondary" style="justify-content:flex-start">
            <span class="material-symbols-outlined" style="font-size:18px;color:#10b981">table_chart</span>Export Attendance CSV
          </button>
          <button onclick="resetDemo()" class="btn" style="justify-content:flex-start;background:#fff5f5;color:#ef4444;border:1.5px solid #fecaca">
            <span class="material-symbols-outlined" style="font-size:18px">restart_alt</span>Reset Demo Data
          </button>
          <button onclick="clearAll()" class="btn btn-danger" style="justify-content:flex-start">
            <span class="material-symbols-outlined" style="font-size:18px">delete_forever</span>Clear All Data
          </button>
        </div>
      </div>
    </div>

    <!-- Save -->
    <div style="margin-top:20px;display:flex;justify-content:flex-end">
      <button onclick="saveSettings()" class="btn btn-primary" style="padding:12px 32px;font-size:14px">
        <span class="material-symbols-outlined" style="font-size:20px">save</span>Save All Settings
      </button>
    </div>

    <!-- DB info -->
    <div class="card" style="padding:20px;margin-top:16px">
      <h3 style="font-size:14px;font-weight:700;color:#0f172a;margin:0 0 14px;display:flex;align-items:center;gap:8px">
        <span class="material-symbols-outlined" style="font-size:20px;color:#8b5cf6">info</span>System Information
      </h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">
        ${sysInfo('Students', DB.getStudents({}).total)}
        ${sysInfo('Attendance Records', DB.getAttendance({limit:9999}).total)}
        ${sysInfo('Users', DB.getUsers().length)}
        ${sysInfo('Storage Used', (JSON.stringify(localStorage).length/1024).toFixed(1)+'KB')}
        ${sysInfo('Version', '2.0.0')}
        ${sysInfo('Last Backup', 'Live (localStorage)')}
      </div>
    </div>
  </div>
  <style>@media(max-width:768px){.sets-grid{grid-template-columns:1fr!important}}</style>`;
}

function sf(label, id, val, type, ph) {
  return `<div><label style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px">${label}</label>
    <input id="${id}" type="${type}" value="${val}" placeholder="${ph}" style="width:100%"/></div>`;
}

function toggle(id, label, sub, checked) {
  return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f8fafc">
    <div><p style="font-size:13px;font-weight:600;color:#374151;margin:0">${label}</p><p style="font-size:11px;color:#94a3b8;margin:0">${sub}</p></div>
    <label style="position:relative;width:44px;height:24px;cursor:pointer;flex-shrink:0">
      <input id="${id}" type="checkbox" ${checked?'checked':''} style="opacity:0;width:0;height:0">
      <span style="position:absolute;inset:0;border-radius:99px;background:${checked?'#3b82f6':'#cbd5e1'};transition:.2s" id="${id}-track"></span>
      <span id="${id}-thumb" style="position:absolute;top:2px;left:${checked?'22':'2'}px;width:20px;height:20px;border-radius:50%;background:white;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s"></span>
    </label>
  </div>`;
}

function sysInfo(label, val) {
  return `<div style="background:#f8fafc;border-radius:10px;padding:12px"><p style="font-size:16px;font-weight:800;color:#0f172a;margin:0">${val}</p><p style="font-size:11px;color:#94a3b8;margin:0">${label}</p></div>`;
}

function saveSettings() {
  const s = {
    collegeName: document.getElementById('s-cname')?.value,
    collegeShort:document.getElementById('s-cshort')?.value,
    academicYear:document.getElementById('s-year')?.value,
    attendanceThreshold: +document.getElementById('s-thresh')?.value,
    lateGraceMinutes:    +document.getElementById('s-grace')?.value,
    maxAbsent:           +document.getElementById('s-maxabs')?.value,
    emailNotify:  document.getElementById('s-email')?.checked,
    autoMarkAbsent: document.getElementById('s-autoabs')?.checked,
    requireBiometric: document.getElementById('s-bioreq')?.checked,
  };
  localStorage.setItem('fas_settings', JSON.stringify(s));
  App.toast('Settings saved!', 'success');
}

function exportAllData() {
  const data = { students: DB.getStudents({limit:9999}).rows, users: DB.getUsers(), attendance: DB.getAttendance({limit:9999}).rows, exported: new Date().toISOString() };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})); a.download = 'attendance_system_backup.json'; a.click();
  App.toast('Data exported!', 'success');
}

function exportCSVAll() {
  const rows = DB.getAttendance({limit:9999}).rows;
  const csv = ['Name,Student ID,Date,Time,Department,Course,Terminal,Status'].concat(rows.map(r=>`"${r.stuName}","${r.stuId}","${App.formatDate(r.checkIn)}","${App.formatTime(r.checkIn)}","${r.dept}","${r.course}","${r.terminal}","${r.status}"`)).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='full_attendance.csv'; a.click();
  App.toast('CSV exported!', 'success');
}

function resetDemo() {
  App.modal('Reset Demo Data','<p style="color:#374151;font-size:14px">This will clear all data and re-seed with fresh demo data. Continue?</p>',()=>{
    ['fas_users','fas_students','fas_terminals','fas_attendance','fas_seq','fas_face_data','fas_announcements'].forEach(k=>localStorage.removeItem(k));
    DB.seed();
    App.toast('Demo data reset!','success');
    render();
  });
}

function clearAll() {
  App.modal('⚠️ Clear ALL Data','<p style="color:#ef4444;font-size:14px;font-weight:600">This will permanently delete ALL students, attendance records and users. This cannot be undone!</p>',()=>{
    Object.keys(localStorage).filter(k=>k.startsWith('fas_')).forEach(k=>localStorage.removeItem(k));
    App.toast('All data cleared','success');
    setTimeout(()=>window.location.href='login.html', 1500);
  });
}

render();
</script></body></html>
